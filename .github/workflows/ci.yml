name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Windows solution
        run: dotnet build YATSSWin\YATSS.sln -c Release

      - name: Run protocol and lap-race tests
        run: dotnet run --project YATSSWin\YATSS.Tests\YATSS.Tests.csproj -c Release
